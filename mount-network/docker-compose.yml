version: "3.7"

services:
  mount-network:
    image: alpine:3.20
    container_name: mount-network
    restart: unless-stopped
    privileged: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /home/umbrel/umbrel/network:/mnt/network
      - ./start.sh:/start.sh
    entrypoint: ["/bin/sh", "/start.sh"]
